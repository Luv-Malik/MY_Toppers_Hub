<script>
    // Motivational Quotes Array
    const quotes = [
      { text: "It always seems impossible until it's done.", author: "- Nelson Mandela" },
      { text: "Don't watch the clock; do what it does. Keep going.", author: "- Sam Levenson" },
      { text: "Push yourself, because no one else is going to do it for you.", author: "- Toppers Secret" },
      { text: "Success is not final, failure is not fatal: it is the courage to continue that counts.", author: "- Winston Churchill" },
      { text: "The expert in anything was once a beginner.", author: "- Helen Hayes" },
      { text: "Work hard in silence, let your success be your noise.", author: "- Frank Ocean" },
      { text: "Action is the foundational key to all success.", author: "- Pablo Picasso" }
    ];

    let currentQuoteIndex = 0;

    function updateQuote() {
      const quoteBox = document.getElementById('quote-box');
      const quoteDisplay = document.getElementById('quote-display');
      const quoteAuthor = document.getElementById('quote-author');

      if (!quoteBox || !quoteDisplay || !quoteAuthor) return;

      quoteBox.style.opacity = '0';

      setTimeout(() => {
        currentQuoteIndex = (currentQuoteIndex + 1) % quotes.length;
        quoteDisplay.innerText = `"${quotes[currentQuoteIndex].text}"`;
        quoteAuthor.innerText = quotes[currentQuoteIndex].author;
        quoteBox.style.opacity = '1';
      }, 400);
    }

    // Dynamic Subjects Configuration Variable (Fetched from JSON/API)
    let subjectsConfig = {};

    // Dynamic Fetch Function
    async function loadSubjectsFromApi() {
      try {
        // Path to JSON or API URL
        const response = await fetch('./notes.json');
        if (!response.ok) throw new Error('Failed to load JSON data');
        
        subjectsConfig = await response.json();
        console.log('Toppers Hub Data Loaded Successfully!');
      } catch (error) {
        console.error('API Load Error:', error);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      // Quotes Initialization
      document.getElementById('quote-display').innerText = `"${quotes[0].text}"`;
      document.getElementById('quote-author').innerText = quotes[0].author;
      setInterval(updateQuote, 5000);

      // Fetch Subjects JSON Data
      loadSubjectsFromApi();
    });

    // Keyboard Accessibility Handler
    function handleKeyPress(e, callback) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        callback();
      }
    }

    // PDF Link Verification with Fallback
    async function handlePdfOpen(event, pdfPath, subjectName, unitNum) {
      event.preventDefault();
      try {
        const response = await fetch(pdfPath, { method: 'HEAD' });
        if (response.ok) {
          window.open(pdfPath, '_blank');
        } else {
          promptMissingPdf(subjectName, unitNum);
        }
      } catch (e) {
        window.open(pdfPath, '_blank');
      }
    }

    function promptMissingPdf(subj, unit) {
      if (confirm(`Unit ${unit} for "${subj}" is currently being prepared by our toppers.\n\nWould you like to request this note right now?`)) {
        openFeedbackModal();
        document.getElementById('fb-message').value = `Please upload notes for ${subj} - Unit ${unit}.`;
      }
    }

    function openSearchModal() {
      const modal = document.getElementById('search-modal');
      modal.classList.remove('hidden');
      setTimeout(() => document.getElementById('modal-search-input').focus(), 100);
    }

    function closeSearchModal() {
      document.getElementById('search-modal').classList.add('hidden');
      document.getElementById('modal-search-input').value = '';
      document.getElementById('modal-search-results').innerHTML = `
        <div style="text-align: center; color: #94a3b8; font-size: 0.8rem; padding: 2rem 0;">
          Start typing above to discover subjects & download units directly.
        </div>
      `;
    }

    function handleModalSearch() {
      const query = document.getElementById('modal-search-input').value.toLowerCase().trim();
      const resultsContainer = document.getElementById('modal-search-results');

      if (!query) {
        resultsContainer.innerHTML = `
          <div style="text-align: center; color: #94a3b8; font-size: 0.8rem; padding: 2rem 0;">
            Start typing above to discover subjects & download units directly.
          </div>
        `;
        return;
      }

      resultsContainer.innerHTML = '';
      let matches = 0;

      Object.keys(subjectsConfig).forEach(sem => {
        subjectsConfig[sem].forEach(subj => {
          const matchName = subj.name.toLowerCase().includes(query);
          const matchId = subj.id.toLowerCase().includes(query);
          const matchAlias = subj.aliases && subj.aliases.some(a => a.toLowerCase().includes(query));

          if (matchName || matchId || matchAlias) {
            matches++;
            const card = document.createElement('div');
            card.className = 'result-card';

            const unitsHtml = subj.units.map(u => {
              const file = `./sem${sem}_${subj.id}_unit${u}.pdf`;
              return `
                <a href="${file}" onclick="handlePdfOpen(event, '${file}', '${subj.name.replace(/'/g, "\\'")}', ${u})" class="unit-btn">
                  Unit ${u} 📄
                </a>
              `;
            }).join(' ');

            card.innerHTML = `
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <strong style="font-size: 0.95rem; color: #fff;">${subj.name}</strong>
                <span class="badge" style="margin-bottom:0;">Sem ${sem}</span>
              </div>
              <div style="margin-top: 0.5rem;">${unitsHtml}</div>
            `;
            resultsContainer.appendChild(card);
          }
        });
      });

      if (matches === 0) {
        resultsContainer.innerHTML = `
          <div style="text-align: center; color: #94a3b8; font-size: 0.8rem; padding: 2rem 0;">
            No matching subjects found for "${query}".
          </div>
        `;
      }
    }

    function openSemModal(semNum) {
      const modal = document.getElementById('sem-modal');
      const container = document.getElementById('modal-content-container');
      container.innerHTML = '';
      document.getElementById('modal-sem-badge').innerText = `Semester 0${semNum}`;

      if (!subjectsConfig[semNum]) {
        document.getElementById('modal-sem-title').innerText = "Semester Under Construction";
        container.innerHTML = `<p style="text-align: center; color: #94a3b8; padding: 2rem 0;">Notes coming soon for Semester 0${semNum}!</p>`;
      } else {
        document.getElementById('modal-sem-title').innerText = `Semester ${semNum} Subjects`;

        subjectsConfig[semNum].forEach((subj) => {
          const card = document.createElement('div');
          card.className = 'result-card';

          let unitsButtons = subj.units.map(uNum => {
            const fileName = `./sem${semNum}_${subj.id}_unit${uNum}.pdf`;
            return `
              <a href="${fileName}" onclick="handlePdfOpen(event, '${fileName}', '${subj.name.replace(/'/g, "\\'")}', ${uNum})" class="unit-btn">
                Open Unit ${uNum} 📄
              </a>
            `;
          }).join('');

          card.innerHTML = `
            <h4 style="font-size: 1rem; color: #fff; margin-bottom: 0.5rem;">📖 ${subj.name}</h4>
            <div>${unitsButtons}</div>
          `;
          container.appendChild(card);
        });
      }
      modal.classList.remove('hidden');
    }

    function closeSemModal() {
      document.getElementById('sem-modal').classList.add('hidden');
    }

    function openFeedbackModal() {
      document.getElementById('feedback-modal').classList.remove('hidden');
    }

    function closeFeedbackModal() {
      document.getElementById('feedback-modal').classList.add('hidden');
    }

    function handleFeedbackSubmit(e) {
      e.preventDefault();
      const name = document.getElementById('fb-name').value;
      const msg = document.getElementById('fb-message').value;
      
      const mailtoUrl = `mailto:luvmalik8684@gmail.com?subject=ToppersHub Feedback from ${encodeURIComponent(name)}&body=${encodeURIComponent(msg)}`;
      window.location.href = mailtoUrl;
      closeFeedbackModal();
    }
  </script>
